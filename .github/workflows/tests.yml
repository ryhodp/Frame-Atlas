name: Tests

# V43 (Day 25): 27+ test scripts existed with nothing running them
# automatically — they only got run when someone remembered, which is how
# "7 of 23 failing on main" happened in July. Every script here builds its
# own throwaway synthetic database (see scripts/test_decks_locally.py for
# the pattern) and never touches real data, so this workflow needs no
# secrets and no fixture files checked into the repo.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Match Railway's actual deploy image (python:3.11-slim) so a pass here
    # means what it says it means.
    env:
      GEMINI_API_KEY: dummy-ci-key
      GOOGLE_OAUTH_CLIENT_ID: dummy-ci-client-id
      GOOGLE_OAUTH_CLIENT_SECRET: dummy-ci-client-secret
      FLASK_SECRET_KEY: dummy-ci-flask-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r backend/requirements.txt

      - name: Run scripts/test_*_locally.py
        run: |
          set +e
          failed=""
          # test_shuffle_locally.py used to be skipped here for a stale
          # pre-V35 recency assertion — but commit de4a4a1 (2026-08-09)
          # already rewrote that assertion to match V35's real behavior, a
          # day BEFORE this skip was added (2026-08-10). The skip was
          # excluding an already-fixed, fully-passing test; nothing here was
          # ever actually stale by the time this workflow existed.
          for f in scripts/test_*_locally.py; do
            echo "::group::$f"
            python "$f"
            status=$?
            echo "::endgroup::"
            if [ $status -ne 0 ]; then
              echo "::error::$f FAILED (exit $status)"
              failed="$failed $f"
            else
              echo "$f passed"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Failing scripts:$failed"
            exit 1
          fi

  frontend-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Pure-logic tests for interactions browser automation can't reliably
      # drive (drag-to-reorder, shift-click range select) — see CLAUDE.md's
      # "Scene reordering" and "Select all results" sections. No npm install
      # needed: both import plain .js files with zero external dependencies.
      - run: node scripts/test_presentation_order.mjs
      - run: node scripts/test_selection_range.mjs
      - run: node scripts/test_deck_add_result.mjs
