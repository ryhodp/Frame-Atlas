<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        padding: 18px;
        width: 320px;
        background: #17181c;
        color: #e2e2e6;
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
        letter-spacing: 0.02em;
      }
      .accent { color: #d9a441; }
      p { margin: 0 0 14px; color: #8e9099; font-size: 12px; }
      label { display: block; margin-bottom: 6px; font-size: 11px; color: #8e9099; letter-spacing: .06em; text-transform: uppercase; }
      input {
        width: 100%;
        box-sizing: border-box;
        background: #0f1013;
        border: 1px solid #383b43;
        border-radius: 7px;
        padding: 9px 11px;
        color: #e2e2e6;
        font: inherit;
      }
      input:focus { outline: none; border-color: #d9a441; }
      button {
        margin-top: 12px;
        width: 100%;
        background: #d9a441;
        color: #2b2100;
        border: 0;
        border-radius: 7px;
        padding: 9px 12px;
        font: 600 13px/1 inherit;
        cursor: pointer;
      }
      button:hover { background: #e5b45c; }
      #status { margin-top: 10px; min-height: 16px; font-size: 12px; color: #b8cea1; }
      #status.err { color: #ffb4ab; }
      .hint { margin-top: 14px; padding-top: 12px; border-top: 1px solid #2a2c31; color: #6f7178; font-size: 11px; }
    </style>
  </head>
  <body>
    <h1><span class="accent">Frame</span> Atlas Clipper</h1>
    <p>Right-click any image — or a video, to grab the frame on screen — and choose <em>Add to Frame Atlas</em>.</p>

    <label for="url">Frame Atlas address</label>
    <input id="url" type="url" placeholder="https://frame-atlas-production.up.railway.app" />
    <button id="save">Save</button>
    <div id="status"></div>

    <div class="hint">
      Clips use the Frame Atlas login already open in this browser. If saving
      fails, open Frame Atlas in a tab, sign in, and try again.
    </div>

    <script src="options.js"></script>
  </body>
</html>
